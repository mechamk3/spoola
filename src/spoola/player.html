<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spoola</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141311;
      --fg: #f3ecdf;
      --muted: #a39888;
      --line: #3c342b;
      --sleeve: #221f1b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: Georgia, "Iowan Old Style", Palatino, serif;
    }
    .station {
      width: min(26rem, calc(100vw - 2.5rem));
      margin: 0 auto;
      padding: 1.75rem 0 3rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.72rem;
    }
    .live {
      display: flex;
      gap: 0.45rem;
      align-items: center;
      color: var(--muted);
    }
    .dot {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: var(--muted);
    }
    body.listening .dot { background: #d45b43; }
    .sleeve {
      aspect-ratio: 1;
      background: var(--sleeve);
      overflow: hidden;
    }
    .sleeve img, .placeholder {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    h1 {
      font-size: 1.7rem;
      font-weight: 500;
      line-height: 1.15;
      margin: 1rem 0 0.3rem;
    }
    .artist, .album { margin: 0; }
    .artist { font-size: 1.05rem; }
    .album {
      margin-top: 0.25rem;
      color: var(--muted);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.85rem;
    }
    .artist:empty, .album:empty { display: none; }
    .meter {
      margin-top: 1.15rem;
      height: 2px;
      background: var(--line);
    }
    #bar {
      height: 100%;
      width: 0;
      background: var(--fg);
    }
    .times {
      display: flex;
      justify-content: space-between;
      margin-top: 0.45rem;
      color: var(--muted);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }
    button {
      margin-top: 1.25rem;
      width: 100%;
      height: 3rem;
      border: 0;
      background: var(--fg);
      color: var(--bg);
      font: 600 0.95rem/1 "Avenir Next", "Segoe UI", sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
    }
    button:focus-visible {
      outline: 2px solid var(--fg);
      outline-offset: 3px;
    }
    #message {
      min-height: 1.2rem;
      margin: 0.8rem 0 0;
      color: var(--muted);
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="station">
    <header>
      <span>Spoola</span>
      <span class="live"><span class="dot"></span> Live</span>
    </header>
    <div class="sleeve">
      <img id="cover" alt="" hidden>
      <div id="placeholder" class="placeholder"></div>
    </div>
    <h1 id="title">Loading…</h1>
    <p id="artist" class="artist"></p>
    <p id="album" class="album"></p>
    <div class="meter" aria-hidden="true"><div id="bar"></div></div>
    <div class="times">
      <span id="elapsed">0:00</span>
      <span id="total">0:00</span>
    </div>
    <button id="play" type="button">Play</button>
    <p id="message" role="status"></p>
  </main>
  <audio id="audio" preload="none"></audio>
  <script>
    const audio = document.querySelector("#audio");
    const button = document.querySelector("#play");
    const title = document.querySelector("#title");
    const artist = document.querySelector("#artist");
    const album = document.querySelector("#album");
    const cover = document.querySelector("#cover");
    const placeholder = document.querySelector("#placeholder");
    const bar = document.querySelector("#bar");
    const elapsed = document.querySelector("#elapsed");
    const total = document.querySelector("#total");
    const message = document.querySelector("#message");

    let listening = false;
    let trackId = null;
    let requestId = 0;

    function fmt(seconds) {
      const whole = Math.max(0, Math.floor(seconds || 0));
      const minutes = Math.floor(whole / 60);
      return minutes + ":" + String(whole % 60).padStart(2, "0");
    }

    function paint(position, duration) {
      const ratio = duration ? Math.min(Math.max(position, 0) / duration, 1) : 0;
      bar.style.width = (ratio * 100) + "%";
      elapsed.textContent = fmt(position);
      total.textContent = fmt(duration);
    }

    function showCover(track) {
      if (!track.artwork) {
        cover.hidden = true;
        cover.removeAttribute("src");
        placeholder.hidden = false;
        return;
      }
      const next = track.artwork;
      if (cover.getAttribute("src") !== next) cover.src = next;
      cover.alt = (track.album || track.title) + " cover";
      cover.hidden = false;
      placeholder.hidden = true;
    }

    cover.addEventListener("error", () => {
      cover.hidden = true;
      placeholder.hidden = false;
    });

    function render(now) {
      const track = now.track;
      if (!track) {
        title.textContent = "Nothing queued";
        artist.textContent = "";
        album.textContent = "";
        document.title = "Spoola";
        showCover({ artwork: null, title: "", album: "" });
        paint(0, 0);
        message.textContent = "Scan a music folder, then refresh this page.";
        audio.removeAttribute("src");
        trackId = null;
        return;
      }
      title.textContent = track.title;
      artist.textContent = track.artist || "";
      album.textContent = track.album || "";
      document.title = track.artist ? track.title + " — " + track.artist : track.title;
      showCover(track);
      if (!listening) paint(now.position, track.duration);
      else total.textContent = fmt(track.duration);
      if (!message.textContent.startsWith("Press play")) message.textContent = "";
    }

    function waitForMetadata() {
      if (audio.readyState >= 1) return Promise.resolve();
      return new Promise((resolve, reject) => {
        const done = () => { cleanup(); resolve(); };
        const fail = () => { cleanup(); reject(new Error("unplayable")); };
        const cleanup = () => {
          audio.removeEventListener("loadedmetadata", done);
          audio.removeEventListener("error", fail);
        };
        audio.addEventListener("loadedmetadata", done);
        audio.addEventListener("error", fail);
      });
    }

    function seekTo(position) {
      const duration = audio.duration;
      if (!Number.isFinite(duration) || position >= duration - 0.25) return;
      audio.currentTime = Math.max(position, 0);
    }

    async function playAudio() {
      try {
        await audio.play();
        return true;
      } catch (error) {
        return false;
      }
    }

    async function attach(now) {
      const track = now.track;
      if (!track) return;
      if (track.id !== trackId) {
        trackId = track.id;
        audio.src = track.audio;
        await waitForMetadata();
        seekTo(now.position);
      } else if (Math.abs(audio.currentTime - now.position) > 2.5) {
        seekTo(now.position);
      }
      if (audio.paused) {
        const started = await playAudio();
        if (!started) {
          listening = false;
          document.body.classList.remove("listening");
          button.textContent = "Play";
          message.textContent = "Press play to listen.";
        }
      }
    }

    async function refresh() {
      const token = ++requestId;
      let now;
      try {
        const response = await fetch("/now", { cache: "no-store" });
        if (!response.ok) throw new Error(String(response.status));
        now = await response.json();
      } catch (error) {
        if (token === requestId) message.textContent = "The station is not responding.";
        return;
      }
      if (token !== requestId) return;
      render(now);
      if (listening && now.track) {
        try {
          await attach(now);
        } catch (error) {
          message.textContent = "This file could not be played.";
        }
      }
    }

    button.addEventListener("click", async () => {
      if (listening) {
        listening = false;
        document.body.classList.remove("listening");
        audio.pause();
        button.textContent = "Play";
        return;
      }
      listening = true;
      document.body.classList.add("listening");
      button.textContent = "Pause";
      message.textContent = "";
      await refresh();
    });

    audio.addEventListener("timeupdate", () => {
      if (!listening || !Number.isFinite(audio.duration)) return;
      paint(audio.currentTime, audio.duration);
    });

    audio.addEventListener("ended", () => {
      if (listening) refresh();
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === " " && event.target === document.body) {
        event.preventDefault();
        button.click();
      }
    });

    refresh();
    setInterval(refresh, 4000);
  </script>
</body>
</html>
